create_github_pr:
  stage: deploy
  script:
    - >
      curl -X POST -H "Authorization: token $GITHUB_PAT" 
      -H "Accept: application/vnd.github.v3+json" 
      https://api.github.com/repos/CryxosMarco/RTOS-Benchmark-collection/pulls 
      -d '{
        "title": "Automated PR from GitLab",
        "head": "branch-with-changes",
        "base": "main",
        "body": "This pull request was automatically generated by GitLab CI/CD."
      }'
  only:
    - main
